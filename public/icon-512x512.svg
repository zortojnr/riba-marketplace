<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark green background for PWA icon -->
  <rect width="512" height="512" fill="#0D2E27" rx="64"/>
  
  <!-- Shopping Bag Icon Group -->
  <g transform="translate(130, 130)">
    <!-- Bag body -->
    <rect x="0" y="0" width="160" height="190" rx="20" fill="#F3F1EA"/>
    <!-- Bag handle -->
    <path d="M25 0 Q80 -40, 135 0" stroke="#F3F1EA" stroke-width="16" fill="none" stroke-linecap="round"/>
    <!-- Bag top fold -->
    <rect x="0" y="0" width="160" height="16" fill="#F3F1EA" rx="8"/>
    <!-- Bag rivets/details -->
    <circle cx="32" y="20" r="6" fill="#E8E6DF"/>
    <circle cx="128" y="20" r="6" fill="#E8E6DF"/>
  </g>
  
  <!-- Riba Text -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="80" font-weight="700" fill="#F3F1EA" text-anchor="middle" letter-spacing="-2">Riba</text>
</svg>