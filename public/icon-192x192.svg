<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark green background for PWA icon -->
  <rect width="192" height="192" fill="#0D2E27" rx="24"/>
  
  <!-- Shopping Bag Icon Group -->
  <g transform="translate(50, 50)">
    <!-- Bag body -->
    <rect x="0" y="0" width="60" height="70" rx="8" fill="#F3F1EA"/>
    <!-- Bag handle -->
    <path d="M10 0 Q30 -15, 50 0" stroke="#F3F1EA" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Bag top fold -->
    <rect x="0" y="0" width="60" height="6" fill="#F3F1EA" rx="3"/>
    <!-- Bag rivets/details -->
    <circle cx="12" y="8" r="2" fill="#E8E6DF"/>
    <circle cx="48" y="8" r="2" fill="#E8E6DF"/>
  </g>
  
  <!-- Riba Text -->
  <text x="96" y="160" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#F3F1EA" text-anchor="middle" letter-spacing="-0.5">Riba</text>
</svg>